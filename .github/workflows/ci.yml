name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependencias
        run: dotnet restore "StockHex API/StockHex API.sln"

      - name: Compilar
        # Los warnings se tratan como error para que la solución no se degrade:
        # hoy compila con cero warnings.
        run: >
          dotnet build "StockHex API/StockHex API.sln"
          --configuration Release
          --no-restore
          -warnaserror

      - name: Auditar dependencias
        # `dotnet list package --vulnerable` sale con código 0 aunque encuentre
        # algo, así que hay que mirar la salida. Se incluyen las transitivas
        # porque es donde estaban: la API no referencia Azure.Identity ni
        # System.Formats.Asn1, le llegan por Microsoft.Data.SqlClient.
        run: |
          dotnet list "StockHex API/StockHex API.sln" package \
            --vulnerable --include-transitive 2>&1 | tee auditoria.txt
          if grep -q -E '^[[:space:]]*>' auditoria.txt; then
            echo "::error::Hay paquetes con vulnerabilidades conocidas."
            exit 1
          fi
          echo "Sin paquetes vulnerables."

      - name: Ejecutar tests con cobertura
        # Incluye los tests contra SQL Server real, que Testcontainers levanta en
        # un contenedor. El runner de GitHub trae Docker, así que se ejecutan; en
        # una máquina sin Docker se omiten solos ([RequiresDockerFact]) en vez de
        # fallar. Por eso este paso tarda unos minutos más que el resto.
        run: >
          dotnet test "StockHex API/StockHex API.sln"
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults
          retention-days: 7

  web:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: StockHex.Web

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: StockHex.Web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Auditar dependencias
        # Sólo las de producción: lo que termina en el bundle que sirve nginx.
        # `npm audit` sí sale con código distinto de 0 cuando encuentra algo.
        run: npm audit --omit=dev --audit-level=moderate

      - name: Verificar tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Compilar
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Construir las imágenes de la API y del frontend
        # Se construyen desde el compose para verificar que los contextos y las
        # rutas del archivo real siguen siendo correctos, no sólo los Dockerfile.
        env:
          MSSQL_SA_PASSWORD: ci-placeholder
          JWT_KEY: clave-de-integracion-continua-suficientemente-larga
          SEED_ADMIN_PASSWORD: ci-placeholder
        run: docker compose build
