# Plantilla: la imagen de nginx sustituye las variables ${...} al arrancar.
upstream stockhex_api {
    server ${API_HOST}:${API_PORT};
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sin esto, cualquier recarga en /productos o /movimientos daría 404: es una
    # SPA y las rutas las resuelve el router en el navegador.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El bundle lleva hash en el nombre, así que se puede cachear indefinidamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html y config.js NO se cachean: uno apunta al bundle vigente y el
    # otro se regenera en cada arranque del contenedor.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location = /config.js {
        add_header Cache-Control "no-store";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Proxy de la API en el mismo origen: el navegador nunca hace una petición
    # cruzada, así que no hay CORS que configurar en el despliegue.
    location /api/ {
        proxy_pass         http://stockhex_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # La API usa X-Forwarded-For para limitar intentos por IP; sin esto todos
        # los usuarios compartirían el cupo del proxy.
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Salud y documentación de la API, por comodidad al operar.
    location /health/ {
        proxy_pass       http://stockhex_api;
        proxy_set_header Host $host;
    }

    location /swagger {
        proxy_pass       http://stockhex_api;
        proxy_set_header Host $host;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
